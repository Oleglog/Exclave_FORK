name: Release Build
on:
  push:
    branches:
      - dev*
    tags:
      - "olcrtc-*"
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.9
          cache: false  # disable module cache — outer go.sum doesn't include Oleglog/j hash, so cache key never changes and CI silently reuses stale j module pulls
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android SDK
      # gomobile can't parse newer version codes like android-36.1 or android-37.0.
      # Always install android-36 for gomobile.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Wipe any module cache the runner image came with — the
          # replace directives point at Oleglog/j pseudo-versions which
          # update independently of go.sum, so a stale cache can pin an
          # ancient revision (this bit us for ~5 releases).
          go clean -modcache || true
          cd library/core/olcrtc_local && go mod download && go mod tidy && cd -
          cd library/core && go mod download && go mod tidy && cd -
          # Print exactly which j is resolved — so we can stop guessing
          # whether Oleglog/j ships in the AAR or zarazaex69/j (original)
          # silently leaks through when the replace directive is broken.
          echo "=== Resolved j module ==="
          cd library/core && go list -m -json github.com/zarazaex69/j || true
          cd -
          ./run lib core
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libsagernetcore.aar
          name: "LibSagerNetCore"
      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets

          if [[ "${GITHUB_REF}" == refs/tags/olcrtc-* || "${{ github.event.inputs.release }}" == "y" ]]; then
            if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASS:-}" || -z "${ALIAS_NAME:-}" || -z "${ALIAS_PASS:-}" ]]; then
              echo "Release APK signing secrets are required: RELEASE_KEYSTORE_BASE64, KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS" >&2
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            ./gradlew :app:assembleOssRelease
            APK="app/build/outputs/apk/oss/release"
          else
            ./gradlew :app:assembleOssDebug
            APK="app/build/outputs/apk/oss/debug"
          fi
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: |
      startsWith(github.ref, 'refs/tags/olcrtc-') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'y' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF##*/}"
            PRE="n"
          else
            TAG="${{ github.event.inputs.tag }}"
            PRE="${{ github.event.inputs.prerelease }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PRE="${{ steps.tag.outputs.prerelease }}"
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          echo "APK files to upload:"
          ls -la apks
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading APKs to it"
            gh release upload "$TAG" ./apks/* --clobber
          else
            ARGS=("$TAG" --title "$TAG" --notes "Built by .github/workflows/release.yml on $(date -u +%FT%TZ)")
            if [ "$PRE" = "y" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "${ARGS[@]}" ./apks/*
          fi
