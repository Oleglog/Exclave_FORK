name: Release Build
on:
  push:
    branches:
      - dev*
    tags:
      - "v*-olcrtc.*"
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.9
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android SDK
      # gomobile can't parse newer version codes like android-36.1 or android-37.0.
      # Always install android-36 for gomobile.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd library/core/olcrtc_local && go mod tidy && cd -
          cd library/core && go mod tidy && cd -
          ./run lib core
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libsagernetcore.aar
          name: "LibSagerNetCore"
      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew :app:downloadAssets
          # Build debug variant so the APK is signed with Android's debug
          # keystore (auto-generated by gradle on first build). The release
          # variant requires a release.keystore that isn't shipped in the
          # repo, and falls back to producing -unsigned.apk files which
          # Android refuses to install. Debug APKs use applicationId
          # io.nekohasekai.sagernet.debug so they can coexist with a
          # release-signed install.
          ./gradlew :app:assembleOssDebug
          APK="app/build/outputs/apk/oss/debug"
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'y' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF##*/}"
            PRE="n"
          else
            TAG="${{ github.event.inputs.tag }}"
            PRE="${{ github.event.inputs.prerelease }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PRE="${{ steps.tag.outputs.prerelease }}"
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          echo "APK files to upload:"
          ls -la apks
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading APKs to it"
            gh release upload "$TAG" ./apks/* --clobber
          else
            ARGS=("$TAG" --title "$TAG" --notes "Built by .github/workflows/release.yml on $(date -u +%FT%TZ)")
            if [ "$PRE" = "y" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "${ARGS[@]}" ./apks/*
          fi
